
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forma | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">forma.</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="students.html">Students</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">

        <section class="hero">
            <p class="eyebrow">Get in touch</p>

            <h1>Let's start a conversation.</h1>

            <p>
                Have a question or want to learn something new?
                Fill out the form below.
            </p>
        </section>

        <section class="section">
            <h2>Send us a message</h2>

            <form action="#" method="get">

                <div class="form-group">
                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="topic">What are you interested in?</label>

                    <select id="topic" name="topic">
                        <option value="">Choose a topic</option>
                        <option value="html">HTML basics</option>
                        <option value="css">CSS styling</option>
                        <option value="design">Web design</option>
                        <option value="other">Something else</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your message</label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message here..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="button">
                    Submit message
                </button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Forma. Built with HTML and CSS.</p>
    </footer>

</body>
</html>
